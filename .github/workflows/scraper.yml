name: Daily Enterprise Job Scraper

on:
  schedule:
    # Runs at 1:00 AM IST (19:30 UTC)
    - cron: '30 19 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd cron_scraper
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper & Supabase Sync Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://tgmhtlqcjgcjedlnthfk.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_ubfak-i16iK-jZCTpZIxTQ_9o10ZqDn' }}
        run: |
          cd cron_scraper
          python main.py
