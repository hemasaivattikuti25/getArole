name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/static/**'
      - 'frontend/**'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Merge Next.js with Legacy Static Files
        run: |
          # Copy the Next.js index (Landing Page) over the old landing page
          cp -f frontend/out/index.html web/static/index.html
          # Copy Next.js assets
          cp -r frontend/out/_next web/static/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/static'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
